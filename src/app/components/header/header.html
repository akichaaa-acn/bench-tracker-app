<header class="header">

  <!-- Left -->
  <div class="header-left">

    <button
      type="button"
      class="menu-button"
      (click)="toggleSidebar()"
      aria-label="Toggle sidebar"
    >
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M4 6h16M4 12h16M4 18h16"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <div class="header-title">

      <span class="header-title-main">
        {{ role === 'admin' ? 'Admin Dashboard' : 'My Dashboard' }}
      </span>

      <span class="header-title-sub">
        {{ role === 'admin'
          ? 'Bench management overview'
          : 'Your bench workspace'
        }}
      </span>

    </div>

  </div>

  <!-- Right -->
  <div class="header-right">

    <button
      type="button"
      class="notification-button"
      aria-label="Notifications"
    >
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M10 21h4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>

      <span class="notification-dot"></span>
    </button>

    <!-- Profile -->
    <div class="profile-container">

      <button
        type="button"
        class="profile-button"
        (click)="toggleProfileMenu()"
      >

        <span class="profile-avatar">
          {{ initials }}
        </span>

        <span class="profile-info">

          <span class="profile-name">
            {{ userName }}
          </span>

          <span class="profile-role">
            {{ userRole }}
          </span>

        </span>

        <svg
          class="profile-arrow"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="m7 10 5 5 5-5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>

      @if (profileMenuOpen) {

        <div class="profile-menu">

          <div class="profile-menu-header">

            <strong>
              {{ userName }}
            </strong>

            <span>
              {{ userRole }}
            </span>

          </div>

          <div class="profile-menu-divider"></div>

          <button
            type="button"
            class="profile-menu-item"
            (click)="switchAccount()"
          >

            <span>
              {{ role === 'admin'
                ? 'Switch to User'
                : 'Switch to Admin'
              }}
            </span>

            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M9 6 15 12 9 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </button>

        </div>

      }

    </div>

  </div>

</header>
